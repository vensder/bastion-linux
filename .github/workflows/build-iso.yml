name: Build installer ISO

# Manual only: Actions -> Build installer ISO -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image to build the ISO from
        type: choice
        options: [bastion-linux, bastion-linux-secureblue, bastion-linux-minimal]
        default: bastion-linux
      tag:
        description: Image tag
        type: string
        default: latest

permissions: {}

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Build only from an image signed with this repo's key, and make sure the
      # pulled image is exactly the one that was verified.
      - name: Verify signature and pull
        env:
          VARIANT: ${{ inputs.variant }}
          TAG: ${{ inputs.tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${VARIANT}:${TAG}"
          VERIFIED=$(cosign verify --key cosign.pub "$IMAGE" --output json \
                     | jq -r '.[0].critical.image."docker-manifest-digest"')
          sudo podman pull "$IMAGE"
          PULLED=$(sudo podman image inspect --format '{{.Digest}}' "$IMAGE")
          echo "verified: $VERIFIED"
          echo "pulled:   $PULLED"
          [ "$VERIFIED" = "$PULLED" ] || { echo "ERROR: digest mismatch" >&2; exit 1; }
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build ISO
        run: |
          sed "s#@IMAGE@#${IMAGE}#" iso/config.toml > "$RUNNER_TEMP/config.toml"
          # Newer Ubuntu confines bwrap, which osbuild needs (runner is throwaway).
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi
          mkdir -p output
          sudo podman run --rm --privileged --net=host \
            --security-opt label=type:unconfined_t \
            --security-opt apparmor=unconfined \
            -v "$RUNNER_TEMP/config.toml":/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs \
            "$IMAGE"

      - name: Name and checksum
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          NAME="${VARIANT}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.iso"
          sudo mv output/bootiso/install.iso "output/${NAME}"
          sudo chown -R "$(id -u):$(id -g)" output
          (cd output && sha256sum "$NAME" > "$NAME.sha256" && cat "$NAME.sha256")
          echo "ISO_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            output/${{ env.ISO_NAME }}
            output/${{ env.ISO_NAME }}.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
