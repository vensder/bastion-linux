name: Build GNOME

# Runs when anything this variant uses changes: its own recipes/gnome/,
# files/gnome/ and files/scripts/gnome/, plus every shared file. The '!' lines
# skip other variants' directories, docs, ISO-only and local-build files.
# Adding a variant: also exclude its directories here.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!recipes/gnome-minimal/**'
      - '!files/gnome-minimal/**'
      - '!files/scripts/gnome-minimal/**'
      - '!.github/workflows/build-gnome-minimal.yml'
      - '!recipes/minimal/**'
      - '!files/minimal/**'
      - '!files/scripts/minimal/**'
      - '!.github/workflows/build-minimal.yml'
      - '!**.md'
      - '!LICENSE'
      - '!iso/**'
      - '!local-build/**'
      - '!.github/workflows/build-iso.yml'
  pull_request:
    paths:
      - '**'
      - '!recipes/gnome-minimal/**'
      - '!files/gnome-minimal/**'
      - '!files/scripts/gnome-minimal/**'
      - '!.github/workflows/build-gnome-minimal.yml'
      - '!recipes/minimal/**'
      - '!files/minimal/**'
      - '!files/scripts/minimal/**'
      - '!.github/workflows/build-minimal.yml'
      - '!**.md'
      - '!LICENSE'
      - '!iso/**'
      - '!local-build/**'
      - '!.github/workflows/build-iso.yml'
  # Daily or weekly rebuild so Fedora security updates reach installed machines
  # (only this, the recommended variant). 14:17 UTC = ~03:17 NZ.
  # Scheduled runs use the default branch and always build, sign and push.
  schedule:
    - cron: "17 14 * * 5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/_build-variant.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      recipe: gnome/recipe.yml
