---
# Silverblue-only trimming (the gnome variant). GNOME lockdown shared with
# gnome-minimal is in shared/gnome-lockdown.yml.
modules:
  # No auto-remove: only these packages go. Check the build log for anything
  # else dnf pulls out because it depends on them.
  - type: dnf
    remove:
      auto-remove: false
      packages:
        - gnome-software
        - gnome-software-rpm-ostree
