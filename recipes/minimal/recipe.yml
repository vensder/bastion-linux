---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# EXPERIMENTAL. Built up from fedora-bootc (no desktop) with an explicit
# package list: greetd + tuigreet login, LXQt on the labwc Wayland compositor,
# no X server.
name: bastion-linux-minimal
description: Bastion Linux, minimal variant (fedora-bootc base, LXQt on labwc, Wayland only).

base-image: quay.io/fedora/fedora-bootc
image-version: 44

modules:
  # Every package added on top of fedora-bootc.
  # DEBUG PHASE: weak dependencies are ON so the session gets everything it may
  # need. Once login works, set install-weak-deps back to false and strip.
  - type: dnf
    install:
      install-weak-deps: true
      packages:
        # login: greetd runs the greeter as an unprivileged user
        - greetd
        - greetd-selinux
        - tuigreet                 # text fallback if the graphical greeter fails
        - cage                     # kiosk compositor that hosts the graphical greeter
        - gtkgreet
        # desktop: LXQt Wayland session on labwc
        - labwc
        - lxqt-session             # the LXQt session itself (startlxqtwayland runs it)
        - lxqt-wayland-session
        - lxqt-labwc-session       # LXQt session files and theme for labwc
        - lxqt-panel
        - lxqt-config
        - lxqt-policykit
        - lxqt-notificationd
        - lxqt-qtplugin
        - lxqt-themes
        - pcmanfm-qt
        # Wayland-native tools: terminal, lock, idle
        - foot
        - swaylock
        - swayidle
        # graphics: Mesa EGL/GL/GBM (the "EGL not initialized" error), Qt Wayland
        # plugin and layer-shell for the LXQt panel, a cursor theme
        - mesa-dri-drivers
        - mesa-libEGL
        - mesa-libGL
        - mesa-libgbm
        - mesa-vulkan-drivers
        - qt6-qtwayland
        - layer-shell-qt
        - adwaita-cursor-theme
        - dejavu-sans-fonts
        - dejavu-sans-mono-fonts
        # network (nmtui for Wi-Fi setup)
        - NetworkManager
        - NetworkManager-wifi
        - NetworkManager-tui
        # needed by the shared hardening and app scripts
        - firewalld
        - jq
        - curl
        - gnupg2
        - bubblewrap
        - xdg-user-dirs

  - from-file: shared/common.yml
  - from-file: shared/librewolf.yml
  - from-file: minimal/modules.yml
