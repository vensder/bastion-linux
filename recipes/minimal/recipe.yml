---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# EXPERIMENTAL. Built up from fedora-bootc (no desktop) with an explicit
# package list: greetd + tuigreet login, LXQt on the labwc Wayland compositor,
# no X server.
name: bastion-linux-minimal
description: Bastion Linux, minimal variant (fedora-bootc base, LXQt on labwc, Wayland only).

base-image: quay.io/fedora/fedora-bootc
image-version: 44

modules:
  # Every package added on top of fedora-bootc. Weak dependencies are off, so
  # nothing arrives unless something here hard-requires it.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # login: greetd runs the greeter as an unprivileged user
        - greetd
        - greetd-selinux
        - tuigreet
        # desktop: LXQt Wayland session on labwc (no lxqt-session X11 parts)
        - labwc
        - lxqt-wayland-session
        - lxqt-panel
        - lxqt-config
        - lxqt-policykit
        - lxqt-notificationd
        - lxqt-qtplugin
        - lxqt-themes
        - pcmanfm-qt
        # Wayland-native tools: terminal, lock, idle
        - foot
        - swaylock
        - swayidle
        - mesa-dri-drivers
        - dejavu-sans-fonts
        - dejavu-sans-mono-fonts
        # network (nmtui for Wi-Fi setup)
        - NetworkManager
        - NetworkManager-wifi
        - NetworkManager-tui
        # needed by the shared hardening and app scripts
        - firewalld
        - jq
        - curl
        - gnupg2
        - bubblewrap
        - xdg-user-dirs

  - from-file: shared/common.yml
  - from-file: shared/librewolf.yml
  - from-file: minimal/modules.yml
