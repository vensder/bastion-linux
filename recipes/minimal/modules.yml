---
# Session setup for the minimal variant (minimal/recipe.yml).
modules:
  # /usr/bin/bastion-session, LXQt compositor choice, idle lock autostart,
  # "Lock screen" menu entry.
  - type: files
    files:
      - source: minimal
        destination: /

  - type: script
    scripts:
      # DEBUG PHASE: miriway kept as a second compositor to try. Re-enable to
      # remove it (lxqt-wayland-session drags it in; we use labwc).
      # - minimal/drop-miriway.sh
      - minimal/configure-greetd.sh
      # Last: reports X server packages and the package count (report-only
      # during the debug phase; see STRICT in the script).
      - minimal/check-minimal.sh

  - type: systemd
    system:
      enabled:
        - greetd.service
