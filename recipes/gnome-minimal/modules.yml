---
# Boot setup for the gnome-minimal variant (gnome-minimal/recipe.yml).
modules:
  # Confined SELinux users: members of group bastion-confined get user_u, no
  # execution from home or /tmp; everyone else unchanged. Boot-time service.
  - type: files
    files:
      - source: gnome-minimal
        destination: /

  - type: script
    scripts:
      - gnome-minimal/confined-users.sh

  - type: systemd
    system:
      enabled:
        - gdm.service
        - bastion-confine-users.service
        - spice-vdagentd.socket   # DEBUG PHASE, see spice-vdagent in recipe.yml

  - type: script
    snippets:
      # Boot to the graphical login instead of a text console.
      - "systemctl set-default graphical.target"
      # For comparing with the other variants in the build log.
      - "echo \"Installed packages: $(rpm -qa | wc -l)\""
      - "echo \"X server packages: $(rpm -qa 'xorg-x11-server*' | tr '\\n' ' ')\""
