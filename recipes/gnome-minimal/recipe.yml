---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# EXPERIMENTAL. GNOME built up from fedora-bootc (no desktop) with an explicit
# package list, instead of trimming Silverblue down. Same GNOME isolation model
# as the gnome variant (no screen capture / clipboard / input injection for
# ordinary apps), far fewer packages.
name: bastion-linux-gnome-minimal
description: Bastion Linux, minimal GNOME (fedora-bootc base, explicit package list).

base-image: quay.io/fedora/fedora-bootc
image-version: 44

modules:
  # Every package added on top of fedora-bootc.
  # DEBUG PHASE: weak dependencies are ON until GNOME boots to a working login;
  # then set install-weak-deps back to false and strip.
  - type: dnf
    install:
      install-weak-deps: true
      packages:
        # login and shell (GDM is needed for GNOME's lock screen)
        - gdm
        - gnome-shell
        - gnome-session
        - gnome-settings-daemon
        - gnome-control-center
        - gnome-keyring            # stores Wi-Fi passwords
        - ptyxis                   # terminal
        - adwaita-icon-theme
        - dejavu-sans-fonts
        - dejavu-sans-mono-fonts
        # graphics: Mesa EGL/GL/GBM. Without mesa-libEGL the compositor cannot
        # initialise EGL (same failure as the LXQt variant had).
        - mesa-dri-drivers
        - mesa-libEGL
        - mesa-libGL
        - mesa-libgbm
        - mesa-vulkan-drivers
        # network
        - NetworkManager
        - NetworkManager-wifi
        # needed by the shared hardening and app scripts
        - firewalld
        - jq
        - curl
        - gnupg2
        - bubblewrap
        - xdg-user-dirs
        - policycoreutils-python-utils   # semanage, for the confined-users service
        # DEBUG PHASE: VM guest agent for clipboard sharing with the host.
        # Keep until testing gives solid results. Remove before real use: it
        # lets the VM host read and set the clipboard.
        - spice-vdagent

  - from-file: shared/common.yml
  - from-file: shared/librewolf.yml
  - from-file: shared/gnome-lockdown.yml
  - from-file: gnome-minimal/modules.yml
