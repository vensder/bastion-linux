---
# Hardening shared by every Bastion Linux variant.
modules:
  # Installs cosign.pub to /etc/pki/containers/ and adds a sigstoreSigned
  # entry for this image to /etc/containers/policy.json.
  - type: signing

  # Must run after `signing`: trusts only our signed images, rejects the rest.
  - type: script
    scripts:
      - lock-container-policy.sh

  # openssh-server: also removes the sshd-vsock / sshd-unix-local sockets.
  # Only if installed, since not every base image ships it.
  - type: script
    snippets:
      - "if rpm -q --quiet openssh-server; then dnf5 -y remove --setopt=clean_requirements_on_remove=False openssh-server; fi"

  # resolved: no LLMNR/mDNS. coredump + sysctl: never write process memory to disk.
  - type: files
    files:
      - source: system
        destination: /

  # Default-deny inbound.
  - type: script
    scripts:
      - firewalld-default-drop.sh

  # Apps come only from the signed image: drop Flatpak remotes, then install
  # the wallet (upstream AppImage, GPG-verified against files/keys/).
  # The browser is per variant (shared/librewolf.yml, or the base image's own).
  - type: script
    scripts:
      - remove-flatpak-remotes.sh
      - install-electrum.sh

  # Masking a unit that does not exist is harmless, so this list is shared.
  - type: systemd
    system:
      masked:
        - cups.service
        - cups.socket
        - cups.path
        - cups-browsed.service
        - avahi-daemon.service
        - avahi-daemon.socket
        - ModemManager.service
        - geoclue.service
        - bluetooth.service
        - systemd-importd.socket   # downloads disk images from the network
        - systemd-coredump.socket
        - flatpak-add-fedora-repos.service   # re-adds the fedora remote at boot
