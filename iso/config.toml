# bootc-image-builder config for the installer ISO (--type anaconda-iso).
#
# Interactive install: you pick the disk, tick "Encrypt my data" (LUKS2) and
# create your own user and password. Nothing secret is baked into the ISO.
#
# @IMAGE@ is replaced with the image reference before the build, e.g.
# ghcr.io/OWNER/bastion-linux:latest (done by .github/workflows/build-iso.yml).

[customizations.installer.kickstart]
contents = """
rootpw --lock

%post --erroronfail
# Only accept signed updates: point the installed system at the
# signature-enforced transport (ostree-image-signed:docker://...).
bootc switch --mutate-in-place --enforce-container-sigpolicy --transport registry @IMAGE@
%end
"""

# Language, keyboard and time zone screens in the installer.
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Timezone",
]
